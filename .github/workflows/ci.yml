name: CI

# Gate de calidad antes de prod. Dokploy hace CD (build + deploy) al pushear a master,
# pero sin validar nada: este workflow corre lint + typecheck + build en cada push y PR
# para que un fallo se detecte acá y no en producción.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancela runs viejos del mismo ref si llega uno nuevo (ahorra minutos en pushes seguidos).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
